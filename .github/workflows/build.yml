name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DADViewer.sln
      - run: dotnet build DADViewer.sln --configuration Release --no-restore -warnaserror
      - run: dotnet test DADViewer.Tests/DADViewer.Tests.csproj --configuration Release --no-build --logger trx
